services:
  redis:
    container_name: promy-redis
    image: redis:7-alpine
    networks:
      - eventbus-network
    ports:
      # Deliberately not the 6379 default, so this doesn't collide with an
      # unrelated Redis a developer may already be running for another
      # project. redis/helper_test.go's testDSN() defaults to this same
      # port (DB 15) — change both together, or set REDIS_TEST_DSN. See #25.
      - "6389:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis's official GUI at http://localhost:5540.
  # "Add database" form: Host `redis`, Port `6379` (container network, not the
  # host-mapped 6389). `127.0.0.1:6389` fails: it resolves inside this container.
  redisinsight:
    container_name: promy-redisinsight
    image: redis/redisinsight:latest
    networks:
      - eventbus-network
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  # Shared trace backend for every promy-* service, UI at http://localhost:16686.
  # Services send OTLP/gRPC to `promy-jaeger:4317` over eventbus-network; the
  # ingest ports (4317 gRPC, 4318 HTTP) stay unmapped because nothing on the
  # host sends spans. In-memory storage: traces are lost on restart.
  jaeger:
    container_name: promy-jaeger
    image: jaegertracing/jaeger:2.22.0
    networks:
      - eventbus-network
    ports:
      - "16686:16686"

networks:
  eventbus-network:
    name: eventbus-network  # force exact name
    driver: bridge

volumes:
  redis-data:
    driver: local
