# Single source of truth for coverage thresholds and exclusions, read by both
# the pre-push hook (check-coverage in .pre-commit-config.yaml) and CI
# (.github/workflows/ci.yml, which calls
# tclavelloux/promy-github-workflows/.github/workflows/go-coverage.yml).
#
# Ratchet policy: floor is set per issue #27's contract (85%), with headroom
# below the ~97% actually achieved to leave room for future feature commits.
# Raise it as coverage grows — never lower it to make a PR pass.
profile: coverage.out

threshold:
  file: 0
  package: 0
  total: 85

exclude:
  paths:
    - main\.go$
    - internal/bootstrap\.go$
    - ^cmd/
    - test/mock\.go$
    - testdata
    - ^examples/
