name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This repo's own docker-compose maps Redis to host port 6389, not the
      # 6379 default (see #25) — GitHub Actions service containers don't
      # offer that same remapping, so point tests at the CI container's real
      # port instead of relying on the local-dev default in redis/helper_test.go.
      REDIS_TEST_DSN: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -failfast -coverpkg=./... -covermode=atomic -coverprofile=coverage.raw.out -count=1 ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.raw.out

  coverage:
    needs: test
    uses: tclavelloux/promy-github-workflows/.github/workflows/go-coverage.yml@v1
    with:
      total-threshold: 85
      exclude-patterns: |
        main\.go:
        internal/bootstrap\.go:
        /cmd/
        test/mock\.go:
        testdata
        examples/
      module-prefix: github.com/tclavelloux/promy-event-bus/
    secrets: inherit

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
