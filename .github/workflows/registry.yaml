name: Validate Event Registry

on:
  pull_request:
    paths:
      - 'registry/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # yq is pinned to an exact release and verified against its published SHA-256
      # (mikefarah/yq `checksums`, SHA-256 column). To bump: change both values together.
      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          chmod +x /usr/local/bin/yq
      - name: Validate registry
        run: bash scripts/validate-registry.sh
