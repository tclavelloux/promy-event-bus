repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: scripts/golangci-lint.sh run --timeout=5m
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: golangci-lint-fmt
        name: golangci-lint-fmt
        entry: scripts/golangci-lint.sh fmt --diff
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: golangci-lint-config-verify
        name: golangci-lint-config-verify
        entry: scripts/golangci-lint.sh config verify
        language: system
        files: '\.golangci\.(yml|yaml)$'
        pass_filenames: false
      - id: go-mod-tidy
        name: go-mod-tidy
        entry: scripts/go-mod-tidy.sh
        language: system
        pass_filenames: false
        files: '(\.go|go\.mod|go\.sum)$'
      - id: check-coverage
        name: check-coverage
        entry: make check-coverage
        language: system
        pass_filenames: false
        stages: [pre-push]
